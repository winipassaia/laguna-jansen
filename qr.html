<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code · Lagoa da Jansen</title>
<link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root { --dusk-deep: #141b45; --sun: #f6a23c; --blush: #d9527a; --tinta-soft: #4a5370; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif; background: #f7f1e6; color: var(--dusk-deep); min-height: 100vh; display: grid; place-items: center; padding: 1.5rem 1rem; }
  .controles { width: min(100%, 34rem); background: #fff; border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 1.5rem; box-shadow: 0 8px 24px rgba(20, 27, 69, .08); }
  .controles label { display: block; font-weight: 700; margin-bottom: .4rem; }
  .linha { display: flex; gap: .5rem; flex-wrap: wrap; }
  .controles input { flex: 1 1 14rem; font: inherit; padding: .6rem .8rem; border: 2px solid #d6c9b2; border-radius: 10px; min-width: 0; }
  .controles button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: .6rem 1.2rem; background: var(--dusk-deep); color: #fff; cursor: pointer; }
  .controles p { font-size: .9rem; color: var(--tinta-soft); margin-top: .5rem; }
  .cartaz { width: min(100%, 34rem); background: #fff; border-radius: 24px; padding: 2.2rem 2rem 2rem; text-align: center; box-shadow: 0 20px 50px rgba(20, 27, 69, .15); border-top: 12px solid var(--sun); }
  .selo { display: inline-block; background: var(--dusk-deep); color: #fff; font-weight: 700; font-size: .85rem; letter-spacing: .04em; border-radius: 999px; padding: .3rem .9rem; }
  h1 { font-family: "Bricolage Grotesque", "Trebuchet MS", sans-serif; font-weight: 800; font-size: clamp(2.4rem, 9vw, 3.6rem); letter-spacing: -.03em; line-height: 1; margin: .9rem 0 .4rem; }
  .sub { font-size: 1.2rem; color: var(--tinta-soft); }
  #qr { margin: 1.6rem auto 1rem; width: min(100%, 22rem); }
  #qr svg { width: 100%; height: auto; display: block; }
  .url { font-weight: 700; font-size: 1.05rem; word-break: break-all; color: var(--blush); }
  .vazio { padding: 3rem 1rem; color: var(--tinta-soft); font-weight: 600; }
  @media print {
    body { background: #fff; padding: 0; }
    .controles { display: none; }
    .cartaz { box-shadow: none; width: 100%; max-width: 17cm; }
  }
</style>
</head>
<body>
<main>
  <form class="controles" id="form">
    <label for="url">Endereço do site</label>
    <div class="linha">
      <input id="url" type="url" placeholder="https://winipassaia.github.io/lagoa-jasen/" autocomplete="off">
      <button type="submit">Gerar</button>
      <button type="button" id="imprimir">Imprimir</button>
    </div>
    <p>Para não precisar digitar sempre, coloque o endereço em <strong>siteUrl</strong> no arquivo config.js.</p>
  </form>

  <section class="cartaz" aria-label="Cartaz com QR code">
    <span class="selo" id="feira">Feira de Ciências Maktub</span>
    <h1>Lagoa da Jansen</h1>
    <p class="sub">Aponte a câmera do celular e conheça a lagoa</p>
    <div id="qr"><p class="vazio">Digite o endereço do site acima.</p></div>
    <p class="url" id="url-texto"></p>
  </section>
</main>

<script src="config.js"></script>
<script src="assets/vendor/qrcode/qrcode.min.js"></script>
<script>
  (function () {
    var cfg = window.SITE_CONFIG || {};
    var feira = cfg.projeto && cfg.projeto.feira;
    if (feira) document.getElementById('feira').textContent = feira;

    var campo = document.getElementById('url');
    var param = new URLSearchParams(location.search).get('url');
    campo.value = param || cfg.siteUrl || '';

    function gerar() {
      var url = campo.value.trim();
      var alvo = document.getElementById('qr');
      var texto = document.getElementById('url-texto');
      if (!url) { alvo.innerHTML = '<p class="vazio">Digite o endereço do site acima.</p>'; texto.textContent = ''; return; }
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      alvo.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
      texto.textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    }
    document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); gerar(); });
    document.getElementById('imprimir').addEventListener('click', function () { gerar(); window.print(); });
    gerar();
  })();
</script>
</body>
</html>
